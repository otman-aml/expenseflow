# Application
spring.application.name=expenseflow-backend

# Server
server.port=8090

# Database (local PostgreSQL via Docker Compose)
# Les valeurs de developpement servent de repli ; en production, Neon fournit
# SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD, qui les priment sur ces
# proprietes. Le mot de passe n'est donc jamais committe.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5434/expenseflow}
spring.datasource.username=${DB_USER:expenseflow}
spring.datasource.password=${DB_PASSWORD:expenseflow}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Actuator (expose health and metrics)
management.endpoints.web.exposure.include=health,metrics
management.endpoint.health.show-details=when-authorized

# Profil local : charge application-local.properties (secrets non commites)
spring.profiles.active=local

# --- CORS ---
# Origines autorisees a appeler l'API, separees par des virgules.
# En production, surcharger par la variable d'environnement
# CORS_ALLOWED_ORIGINS (ou SPRING_APPLICATION_JSON). Sans cela, le navigateur
# refuse chaque appel du front deploye, sans erreur visible cote serveur.
cors.allowed-origins=http://localhost:4300

# JWT (HS256) - secret d'au moins 32 caracteres, JWT_SECRET prioritaire sur jwt.secret
jwt.secret=${JWT_SECRET:}
jwt.expiration=3600000

# Fournisseur LLM (Groq, API compatible OpenAI)
# La cle est vide par defaut : l'application demarre normalement, seule la
# brique d'extraction repond 503 tant que GROQ_API_KEY n'est pas definie.
llm.api.key=${GROQ_API_KEY:}
llm.model=openai/gpt-oss-120b
llm.base-url=https://api.groq.com/openai/v1
llm.timeout-seconds=15
