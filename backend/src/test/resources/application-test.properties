# ============================================================
# Configuration des TESTS (profil "test")
# Ce fichier n'est JAMAIS charge en production ni en local :
# il est reserve a la suite de tests, ou le profil actif est
# explicitement "test" via @ActiveProfiles("test").
#
# Point cle : le profil "local" NE doit PAS etre actif pendant
# les tests, car application-local.properties pointe vers la base
# de developpement locale. Les tests d'integration branchent, eux,
# sur un conteneur PostgreSQL jetable via @DynamicPropertySource.
# ============================================================

# --- Base de donnees ---
# L'URL, l'identifiant et le mot de passe sont surcharges au
# runtime par @DynamicPropertySource, qui les lit sur le conteneur
# Testcontainers. Les valeurs ci-dessous ne sont qu'un repli.
spring.datasource.url=jdbc:postgresql://localhost:5432/expenseflow_test
spring.datasource.username=expenseflow
spring.datasource.password=expenseflow
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# --- Flyway ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# --- JWT ---
# Secret de test : au moins 32 caracteres, car l'algorithme HS256
# exige une cle de 256 bits. Sans ce bloc, le demarrage du contexte
# echouerait sur la validation de JwtService.
jwt.secret=test-secret-at-least-64-characters-long-for-hs256-algorithm-0123456789
jwt.expiration=3600000

# --- Brique IA ---
# Une cle factice suffit : MockRestServiceServer intercepte la requete avant
# qu'elle n'atteigne le reseau, donc la valeur n'est jamais verifiee par
# Groq. Elle doit toutefois etre non vide, sinon GroqClient leve
# LlmConfigException avant d'appeler — et le test du 503, qui verifie
# precisement cette absence de cle, aurait besoin d'un second contexte.
llm.api.key=cle-de-test
llm.model=openai/gpt-oss-120b
llm.base-url=https://api.groq.com/openai/v1
llm.timeout-seconds=15
