
services:

  # ---------- Base de donnees ----------
  postgres:
    image: postgres:16-alpine
    container_name: expenseflow-postgres
    restart: unless-stopped
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-expenseflow}
      POSTGRES_USER: ${POSTGRES_USER:-expenseflow}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-expenseflow}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U expenseflow -d expenseflow"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ---------- API ----------
  backend:
    build:
      context: ./backend
    container_name: expenseflow-backend
    restart: unless-stopped
    ports:
      - "8090:8090"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: default
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/expenseflow
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-expenseflow}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-expenseflow}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET manquant - creez .env a partir de .env.example}
      GROQ_API_KEY: ${GROQ_API_KEY:?GROQ_API_KEY manquant - creez .env a partir de .env.example}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4300}

  # ---------- Front ----------
  frontend:
    build:
      context: ./frontend
    container_name: expenseflow-frontend
    restart: unless-stopped
    ports:
      - "4300:8080"
    depends_on:
      - backend

volumes:
  postgres_data:
