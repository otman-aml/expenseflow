<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ExpenseFlow — Gestion de notes de frais</title>
    <meta
      name="description"
      content="Gestion de notes de frais avec circuit d'approbation et extraction de dépense par IA."
    />

    <!--
      Police Inter.

      Le <link> est dans le HTML et non dans index.css : une feuille de
      style bloque le rendu du navigateur jusqu'à sa propre arrivée, ce
      qui retarderait d'autant l'affichage de la police.

      `display=swap` autorise le rendu immédiat avec la police de repli,
      puis substitue Inter dès son arrivée. Sans lui, la page resterait
      invisible pendant le téléchargement — le défaut le plus visible sur
      une connexion lente.

      `preconnect` ouvre la connexion TLS pendant l'analyse du document,
      en parallèle du téléchargement de la police.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
