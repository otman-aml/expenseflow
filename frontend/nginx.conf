# Configuration nginx du front ExpenseFlow.
#
# Trois reglages font le sens de ce fichier.
#
# 1) location /api { proxy_pass } : le navigateur appelle l'API en chemin
#    relatif ("/api"), comme le fait le proxy de Vite en developpement. Il
#    faut donc que nginx relaie ces appels au backend, exactement comme Vite le
#    fait : sans ce bloc, /api est traite comme une page de l'application et
#    renvoie index.html. Un POST de connexion repond alors 405, ce qui est
#    trompeur — la page s'affiche, mais aucune donnee n'arrive jamais.
#
#    Ce proxy supprime aussi tout CORS : le navigateur ne voit qu'une seule
#    origine (4300), donc ni preflight ni en-tete CORS. C'est le meme schema
#    que le developpement, ce qui evite d'avoir a corriger une divergence
#    entre les deux.
#
# 2) try_files ... /index.html : une application monopage possede des routes
#    (/notes/new, /login) qui n'existent pas sur le disque. Sans cette
#    redirection, un rafraichissement de page ou un lien partage en direct
#    renverrait 404, et l'utilisateur verrait une page blanche.
#
# 3) port 8080 plutot que 80 : le conteneur tourne en utilisateur non root,
#    or le port inferieur a 1024 exige des privileges root. Le mapping
#    "4300:8080" du compose expose le bon port de l'exterieur.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Requetes vers l'API : relaiees au service "backend" du compose, resolu
    # par le reseau interne de Docker.
    location /api/ {
        proxy_pass http://backend:8090/api/;

        # Ces en-tetes indiquent a nginx que la reponse vient d'un serveur
        # amont. Sans eux, le client croit parler a nginx et s'attend donc a
        # un dialogue simple.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # L'extraction IA appelle un modele distant et peut depasser le
        # delai par defaut de 60 s, alors que le front abandonne au-dela de
        # 10 s. On l'aligne sur le client pour ne pas garder une connexion
        # ouverte dans le vide apres que le navigateur a abandonne.
        proxy_read_timeout 30s;
    }

    # Toute route inconnue est servie par index.html, qui contient
    # l'application ; c'est au routeur cote client que revient la decision
    # d'afficher la bonne page.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Les fichiers versionnes par leur empreinte de contenu peuvent etre
    # caches indefiniment : un nom change a chaque build, donc le navigateur
    # recharge toujours la bonne version.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html, lui, ne doit jamais etre en cache : c'est lui qui pointe
    # vers les fichiers ci-dessus. Le mettre en cache longerait d'une version
    # le front apres chaque deploiement.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml;
    gzip_min_length 1024;
}
